services:
  - type: web
    name: pmc-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DATABASE_PATH
        value: pmc_bot.sqlite3
      - key: MAX_GROUPS_PER_PAGE
        value: "5"
      - key: MAX_REPEATS
        value: "5000"
      - key: MAX_DELAY_SECONDS
        value: "3600"
