services:
  - type: web
    name: pmc-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        value: pmc_secret
      - key: WEBHOOK_URL
        sync: false
      - key: DATABASE_PATH
        value: pmc_bot.sqlite3
      - key: MAX_GROUPS_PER_PAGE
        value: "5"
      - key: MAX_REPEATS
        value: "1000"
      - key: MAX_DELAY_SECONDS
        value: "3600"
